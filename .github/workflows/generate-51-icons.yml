name: Generate Luma 5.1 icons
on:
  push:
    branches: [luma-5.1-worlds-and-identity]
permissions:
  contents: write
jobs:
  icons:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate premium app icons
        run: node scripts/build-icons.mjs
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/studio-180.png icons/studio-192.png icons/studio-512.png
          git diff --cached --quiet && exit 0
          git commit -m "Generate Luma 5.1 app icons"
          git push
